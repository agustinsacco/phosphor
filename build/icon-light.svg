<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Phosphor mark — "the beacon", light-background twin of build/icon.svg.
    Same geometry, ember accent on paper. The shell opacities are bumped
    (.35→.5, .2→.34) because a translucent ember line on paper loses far more
    of its contrast than the same line loses on graphite. Used for light-theme
    documentation (the README swaps on prefers-color-scheme); NOT a platform
    icon — generate-icons.mjs only reads icon.svg.

    The bloom nearly vanishes here. That is correct: a glow is a thing a dark
    surface does. On paper the mark carries its weight in the nucleus and the
    orbit instead.
  -->
  <defs>
    <linearGradient id="ember" gradientUnits="userSpaceOnUse" x1="512" y1="134" x2="512" y2="890">
      <stop offset="0%" stop-color="#b35c0f"/>
      <stop offset="100%" stop-color="#9d500b"/>
    </linearGradient>
    <radialGradient id="bloomLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b35c0f" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#b35c0f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b35c0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#f7f7f8"/>
  <circle cx="512" cy="512" r="340" fill="url(#bloomLight)"/>
  <g fill="none" stroke="#b35c0f">
    <circle cx="512" cy="512" r="308" stroke-width="42" opacity="0.5"/>
    <circle cx="512" cy="512" r="168" stroke-width="28" opacity="0.34"/>
  </g>
  <circle cx="512" cy="512" r="84" fill="url(#ember)"/>
  <path d="M204 512A308 308 0 0 1 512 204" fill="none" stroke="url(#ember)" stroke-width="70" stroke-linecap="round"/>
  <circle cx="512" cy="204" r="70" fill="url(#ember)"/>
</svg>
