<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Phosphor mark — "electron shell", light-background twin of build/icon.svg.
    Same geometry, ember accent on paper; shell opacities are bumped because
    thin amber lines vanish on paper at the dark values. Used for light-theme
    documentation (the README swaps on prefers-color-scheme); NOT a platform
    icon — generate-icons.mjs only reads icon.svg.
  -->
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b35c0f"/>
      <stop offset="100%" stop-color="#9d500b"/>
    </linearGradient>
    <radialGradient id="bloomLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b35c0f" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#b35c0f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b35c0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#f7f7f8"/>
  <circle cx="512" cy="470" r="330" fill="url(#bloomLight)"/>
  <g stroke="#b35c0f" fill="none">
    <circle cx="512" cy="470" r="170" stroke-width="10" opacity="0.24"/>
    <circle cx="512" cy="470" r="255" stroke-width="10" opacity="0.19"/>
    <circle cx="512" cy="470" r="340" stroke-width="10" opacity="0.14"/>
  </g>
  <g transform="translate(161.7 153.8) scale(0.62)">
    <path d="M340 220 H560 C700 220 790 305 790 425 C790 545 700 630 560 630 H430 V800 H340 Z M430 310 H552 C640 310 700 355 700 425 C700 495 640 540 552 540 H430 Z" fill="url(#ember)" fill-rule="evenodd"/>
  </g>
  <text x="512" y="850" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="64" fill="#b35c0f" opacity="0.75">2 · 8 · 5</text>
</svg>
