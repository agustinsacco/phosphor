<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Phosphor mark — "aperture".
    A ring of six discrete segments around a Phosphor core: one orchestrator,
    many agents holding position. Phosphor amber on warm graphite
    (see specs/reference/style-guide.md §Logo).

    Two things are load-bearing:
    1. The dash pattern divides the circumference exactly six times
       (2*pi*258 = 1621.0618 = 6 * (144.17697 + 126)), so the ring has no
       seam. Changing r or the segment count means recomputing both numbers.
    2. The bloom is a radial gradient, not stacked translucent circles.
       Stacked circles rasterize as two hard-edged discs — a bullseye, not a
       glow.

    Regenerate platform assets with: node scripts/generate-icons.mjs
    Light-background twin: build/icon-light.svg (keep the two in step).
  -->
  <defs>
    <linearGradient id="Phosphor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ab4e"/>
      <stop offset="100%" stop-color="#e2922e"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2ab4e" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#eca03d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#eca03d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#1f1c18"/>
  <circle cx="512" cy="512" r="246" fill="url(#bloom)"/>
  <circle cx="512" cy="512" r="258"
          fill="none" stroke="url(#Phosphor)" stroke-width="78" stroke-linecap="round"
          stroke-dasharray="144.17697 126" opacity="0.92"
          transform="rotate(-106.009 512 512)"/>
  <circle cx="512" cy="512" r="104" fill="url(#Phosphor)"/>
</svg>
