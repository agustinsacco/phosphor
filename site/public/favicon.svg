<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Phosphor mark — "the beacon".
    A steady nucleus, two faint shells and one orbiting signal. This is the
    SAME OBJECT as the app's working indicator: src/components/PhosphorLoader.tsx
    draws it on a 32-unit viewBox; this file draws it on 1024 at exactly 28×
    that scale. See docs/style-guide.md §Logo.

    Four things are load-bearing:
    1. The geometry is NOT owned here. `BEACON` in
       src/components/PhosphorMark.tsx is the source of truth; this file is
       that object times 28 — a factor chosen because every value stays a
       whole number (11/6/3, stroke 1.5/1, orbit 2.5 → 308/168/84, stroke
       42/28, orbit 70). src/components/PhosphorMark.test.ts reads this file
       back and fails if the two drift apart.
    2. The contrast hierarchy IS the mark. The shells sit at .35/.2 and are
       allowed to vanish at small sizes, because the nucleus, the orbit and
       the head are full-strength and carry it alone. The mark before this one
       inverted that — its concept lived in .10 rings and a 64px caption, and
       both were gone by 48px.
    3. The bloom is a radial gradient, not stacked translucent circles.
       Stacked circles rasterize as hard-edged discs — a bullseye, not a glow.
    4. The gradient is userSpaceOnUse across the mark's full height. On the
       default objectBoundingBox each of the three bright elements would get
       its own ramp and they would stop reading as one object.

    No text and no letterform: "Phosphor" is set separately, in the mono face.
    The centre is the canvas centre (512, 512) — unlike every mark before it,
    nothing occupies a bottom band.

    Regenerate platform assets with: node scripts/generate-icons.mjs
    (it also writes site/public/favicon.svg, so the site cannot drift).
    Light-background twin: build/icon-light.svg — keep the two in step.
  -->
  <defs>
    <linearGradient id="phosphor" gradientUnits="userSpaceOnUse" x1="512" y1="134" x2="512" y2="890">
      <stop offset="0%" stop-color="#f2ab4e"/>
      <stop offset="100%" stop-color="#e2922e"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2ab4e" stop-opacity="0.24"/>
      <stop offset="45%" stop-color="#eca03d" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#eca03d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#1f1c18"/>
  <circle cx="512" cy="512" r="340" fill="url(#bloom)"/>
  <g fill="none" stroke="#eca03d">
    <circle cx="512" cy="512" r="308" stroke-width="42" opacity="0.35"/>
    <circle cx="512" cy="512" r="168" stroke-width="28" opacity="0.2"/>
  </g>
  <circle cx="512" cy="512" r="84" fill="url(#phosphor)"/>
  <path d="M204 512A308 308 0 0 1 512 204" fill="none" stroke="url(#phosphor)" stroke-width="70" stroke-linecap="round"/>
  <circle cx="512" cy="204" r="70" fill="url(#phosphor)"/>
</svg>
