# Deploy renders these placeholders under RUNNER_TEMP and applies this Secret on
# its own, with kubectl's output suppressed. It is deliberately not in the
# kustomization. Never store values in git.
apiVersion: v1
kind: Secret
metadata:
  name: phosphor-control
  namespace: phosphor
type: Opaque
stringData:
  supabase-secret-key: '${SUPABASE_SECRET_KEY}'
  edge-secret: '${CONTROL_EDGE_SECRET}'
