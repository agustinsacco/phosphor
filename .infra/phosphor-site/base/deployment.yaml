apiVersion: apps/v1
kind: Deployment
metadata:
  name: phosphor-site
  namespace: phosphor
  labels:
    app: phosphor-site
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: phosphor-site
  template:
    metadata:
      labels:
        app: phosphor-site
      annotations:
        # The deploy sets this to its run, so each deploy rolls the pods and a
        # rotated Secret is read. `local` marks an unrendered manifest.
        phosphor.saccolabs.com/deploy-run: local
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: phosphor-site
          # The workflow rewrites this tag to the pushed image's digest before
          # applying, so a rollout is pinned to exactly what was built.
          image: saccodigital/phosphor-site:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5015
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: CONTROL_TRUST_PROXY
              value: cloudflare
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: phosphor-control
                  key: supabase-secret-key
            - name: CONTROL_EDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: phosphor-control
                  key: edge-secret
            - name: CONTROL_GRANT_KEYS
              valueFrom:
                secretKeyRef:
                  name: phosphor-control
                  key: grant-keys
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 100m
      imagePullSecrets:
        - name: docker-registry-key
