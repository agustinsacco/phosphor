name: Host Release

# Publishes a signed Host release: three bundles (linux-x64, linux-arm64,
# darwin-arm64), a manifest signed with HOST_RELEASE_SIGNING_KEY, and the
# installer generated from HOST_RELEASE_KEYS. Each version is its own
# `host-v<version>` release; the rolling `host-latest` release carries the
# unversioned manifest and installer that `install.sh` and `phosphor update`
# read. Neither is ever marked latest: Desktop's latest release is untouched.
#
# It runs after every green CI push to main, like Desktop's continuous release,
# and publishes the next patch version only when Nx reports `host` affected
# since the newest host-v tag (tools/scripts/release-scope.mjs). Run by hand,
# it releases the exact main commit as the given version, or the next patch.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Host version (X.Y.Z) higher than every published one; empty for the next patch
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Ineligible runs (red CI, other refs) get a group of their own, so they can
  # never replace a queued release.
  group: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'host-release' || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
      ship: ${{ steps.decide.outputs.ship }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI validated, with history and tags for the Nx comparison.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pick the version and decide
        id: decide
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Every host-v tag, paginated: Desktop releases never hide a Host version.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/host-v" \
            --jq '.[].ref | ltrimstr("refs/tags/host-v")')
          newest=$(printf '%s\n' "$tags" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)
          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then
            [[ -n "$newest" ]] || { echo "::error::No host-v release to follow; give a version"; exit 1; }
            version="${newest%.*}.$(( ${newest##*.} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=true
          if [[ "$EVENT" == workflow_run ]] && sh tools/scripts/should-skip-release.sh "$HEAD_MESSAGE"; then
            release=false
          elif [[ "$EVENT" == workflow_run ]]; then
            # Every doubt (no tag, Nx failure) releases; see release-scope.mjs.
            npm ci --ignore-scripts --no-audit --no-fund
            scope=$(node tools/scripts/release-scope.mjs "host-v$newest" host)
            echo "$scope"
            release=$(jq -r .release <<<"$scope")
          fi
          echo "ship=$release" >> "$GITHUB_OUTPUT"
          echo "::notice::Host $version from $(git rev-parse --short HEAD): ship=$release"

  native:
    name: Native PTY (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.ship == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: darwin-arm64, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      # node-pty is a Desktop dependency with its own lockfile; the root
      # postinstall that installs it is skipped by --ignore-scripts.
      - run: npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
      - name: Build and verify native PTY with the bundled Node
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {nodeArchive} from "./tools/host-release/build-bundle.mjs"; await nodeArchive(process.env.TARGET, process.env.RUNNER_TEMP + "/node-cache")'
          V=$(node -p "require('./tools/host-release/node.json').version")
          tar -xzf "$RUNNER_TEMP/node-cache/node-v$V-$TARGET.tar.gz" -C "$RUNNER_TEMP"
          node tools/host-release/build-native.mjs --out "$RUNNER_TEMP/native" --node "$RUNNER_TEMP/node-v$V-$TARGET/bin/node"
      - uses: actions/upload-artifact@v4
        with:
          name: host-native-${{ matrix.target }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error

  release:
    name: Build, sign and publish the Host
    needs: [plan, native]
    runs-on: ubuntu-latest
    if: needs.plan.outputs.ship == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Verify exact-SHA main CI
        uses: actions/github-script@v7
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const sha = process.env.SHA
            if (context.ref !== 'refs/heads/main' || !/^[0-9a-f]{40}$/.test(sha) ||
                execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== sha) {
              throw new Error('Host releases require the exact main checkout')
            }
            const request = { ...context.repo, workflow_id: 'ci.yml' }
            const { data: workflow } = await github.rest.actions.getWorkflow(request)
            if (workflow.path !== '.github/workflows/ci.yml' || workflow.name !== 'CI' || !Number.isInteger(workflow.id)) {
              throw new Error('Cannot verify CI workflow identity')
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...request, branch: 'main', event: 'push', head_sha: sha, per_page: 100,
            })
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const runs = data.workflow_runs.filter(run =>
              run.workflow_id === workflow.id && run.path === workflow.path && run.name === 'CI' &&
              run.repository?.full_name === repository && run.head_repository?.full_name === repository &&
              run.event === 'push' && run.head_branch === 'main' && run.head_sha === sha)
            runs.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)
            if (runs[0]?.status !== 'completed' || runs[0]?.conclusion !== 'success') {
              throw new Error('Wait for successful exact-SHA main CI before releasing the Host')
            }

      - name: Check the version
        id: version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "::error::Version must be X.Y.Z"; exit 1
          fi
          # Every host-v tag, paginated: Desktop releases never hide a Host version.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/host-v" \
            --jq '.[].ref | ltrimstr("refs/tags/host-v")')
          newest=$(printf '%s\n' "$tags" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)
          resume=false
          if printf '%s\n' "$tags" | grep -qxF "$VERSION"; then
            # A failed run resumes only from the commit that created the tag; the
            # rebuilt bytes are then identical and are compared before any upload.
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/host-v$VERSION" --jq '.object.sha')
            if [[ "$tagged" != "$SHA" ]]; then
              echo "::error::host-v$VERSION already exists on another commit"; exit 1
            fi
            resume=true
          fi
          highest=$(printf '%s\n%s\n' "$newest" "$VERSION" | grep . | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [[ "$highest" != "$VERSION" || ( "$newest" == "$VERSION" && "$resume" != true ) ]]; then
            echo "::error::$VERSION is not higher than host-v$newest"; exit 1
          fi
          echo "resume=$resume" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          pattern: host-native-*
          path: native-artifacts

      - name: Build the three bundles
        env:
          HOST_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node tools/host-release/installer.mjs --require
          for target in linux-x64 linux-arm64 darwin-arm64; do
            node tools/host-release/build-bundle.mjs --target "$target" --out dist --cache "$RUNNER_TEMP/node-cache" --native "native-artifacts/host-native-$target"
          done

      - name: Sign the manifest
        env:
          HOST_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          HOST_RELEASE_SIGNING_KEY: ${{ secrets.HOST_RELEASE_SIGNING_KEY }}
        run: node tools/host-release/manifest.mjs --out dist

      - name: Verify the signature against the pinned keys
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node tools/host-release/installer.mjs --allowed-signers > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I phosphor-release \
            -n phosphor-host-release -s "dist/phosphor-host-$VERSION.manifest.json.sig" \
            < "dist/phosphor-host-$VERSION.manifest.json"
          grep -q '^phosphor-release namespaces="phosphor-host-release" ssh-ed25519 ' dist/install.sh

      - name: Publish host-v${{ needs.plan.outputs.version }} and host-latest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RESUME: ${{ steps.version.outputs.resume }}
          SHA: ${{ needs.plan.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          assets=(phosphor-host-"$VERSION"-*.tar.gz "phosphor-host-$VERSION.manifest.json" \
            "phosphor-host-$VERSION.manifest.json.sig" install.sh)
          [[ ${#assets[@]} -eq 6 ]]
          if [[ "$RESUME" != true ]]; then
            gh release create "host-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --latest=false --title "Phosphor Host $VERSION" \
              --notes "Signed Phosphor Host $VERSION. Install: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/host-latest/install.sh | sh"
          fi
          # Upload what is missing; an asset already published must be byte-identical.
          published=$(gh release view "host-v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          mkdir -p "$RUNNER_TEMP/published"
          missing=()
          for asset in "${assets[@]}"; do
            if printf '%s\n' "$published" | grep -qxF "$asset"; then
              gh release download "host-v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$asset" \
                --dir "$RUNNER_TEMP/published" --clobber
              cmp -s "$asset" "$RUNNER_TEMP/published/$asset" || { echo "::error::$asset differs from the published one"; exit 1; }
            else
              missing+=("$asset")
            fi
          done
          for asset in "${missing[@]}"; do
            gh release upload "host-v$VERSION" --repo "$GITHUB_REPOSITORY" "$asset"
          done
          cp "phosphor-host-$VERSION.manifest.json" phosphor-host.manifest.json
          cp "phosphor-host-$VERSION.manifest.json.sig" phosphor-host.manifest.json.sig
          if ! gh release view host-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create host-latest --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --latest=false --title "Phosphor Host (latest)" \
              --notes "Rolling pointer to the newest signed Phosphor Host release."
          fi
          gh release upload host-latest --repo "$GITHUB_REPOSITORY" --clobber \
            phosphor-host.manifest.json phosphor-host.manifest.json.sig install.sh
