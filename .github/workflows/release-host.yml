name: Host Release

# Publishes a signed Host release by hand: three bundles (linux-x64,
# linux-arm64, darwin-arm64), a manifest signed with HOST_RELEASE_SIGNING_KEY,
# and the installer generated from HOST_RELEASE_KEYS. Each version is its own
# `host-v<version>` release; the rolling `host-latest` release carries the
# unversioned manifest and installer that `install.sh` and `phosphor update`
# read. Neither is ever marked latest: Desktop's latest release is untouched.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Host version (X.Y.Z), higher than every published Host release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: host-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish the Host
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact-SHA main CI
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            if (context.ref !== 'refs/heads/main' ||
                execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== context.sha) {
              throw new Error('Host releases require the exact main checkout')
            }
            const request = { ...context.repo, workflow_id: 'ci.yml' }
            const { data: workflow } = await github.rest.actions.getWorkflow(request)
            if (workflow.path !== '.github/workflows/ci.yml' || workflow.name !== 'CI' || !Number.isInteger(workflow.id)) {
              throw new Error('Cannot verify CI workflow identity')
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...request, branch: 'main', event: 'push', head_sha: context.sha, per_page: 100,
            })
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const runs = data.workflow_runs.filter(run =>
              run.workflow_id === workflow.id && run.path === workflow.path && run.name === 'CI' &&
              run.repository?.full_name === repository && run.head_repository?.full_name === repository &&
              run.event === 'push' && run.head_branch === 'main' && run.head_sha === context.sha)
            runs.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)
            if (runs[0]?.status !== 'completed' || runs[0]?.conclusion !== 'success') {
              throw new Error('Wait for successful exact-SHA main CI before releasing the Host')
            }

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "::error::Version must be X.Y.Z"; exit 1
          fi
          if gh release view "host-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::host-v$VERSION already exists"; exit 1
          fi
          # The newest published Host version must be lower than this one.
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '.[].tagName | select(test("^host-v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("host-v")' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [[ -n "$newest" ]] && [[ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" != "$VERSION" || "$newest" == "$VERSION" ]]; then
            echo "::error::$VERSION is not higher than host-v$newest"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the three bundles
        env:
          HOST_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node tools/host-release/installer.mjs --require
          for target in linux-x64 linux-arm64 darwin-arm64; do
            node tools/host-release/build-bundle.mjs --target "$target" --out dist --cache "$RUNNER_TEMP/node-cache"
          done

      - name: Sign the manifest
        env:
          HOST_RELEASE_VERSION: ${{ inputs.version }}
          HOST_RELEASE_SIGNING_KEY: ${{ secrets.HOST_RELEASE_SIGNING_KEY }}
        run: node tools/host-release/manifest.mjs --out dist

      - name: Verify the signature against the pinned keys
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node tools/host-release/installer.mjs --allowed-signers > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I phosphor-release \
            -n phosphor-host-release -s "dist/phosphor-host-$VERSION.manifest.json.sig" \
            < "dist/phosphor-host-$VERSION.manifest.json"
          grep -q '^phosphor-release namespaces="phosphor-host-release" ssh-ed25519 ' dist/install.sh

      - name: Publish host-v${{ inputs.version }} and host-latest
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          gh release create "host-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false --title "Phosphor Host $VERSION" \
            --notes "Signed Phosphor Host $VERSION. Install: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/host-latest/install.sh | sh" \
            phosphor-host-"$VERSION"-*.tar.gz \
            "phosphor-host-$VERSION.manifest.json" "phosphor-host-$VERSION.manifest.json.sig" install.sh
          cp "phosphor-host-$VERSION.manifest.json" phosphor-host.manifest.json
          cp "phosphor-host-$VERSION.manifest.json.sig" phosphor-host.manifest.json.sig
          if ! gh release view host-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create host-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest=false --title "Phosphor Host (latest)" \
              --notes "Rolling pointer to the newest signed Phosphor Host release."
          fi
          gh release upload host-latest --repo "$GITHUB_REPOSITORY" --clobber \
            phosphor-host.manifest.json phosphor-host.manifest.json.sig install.sh
