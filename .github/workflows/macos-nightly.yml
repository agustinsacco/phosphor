name: macOS nightly

# The whole Desktop e2e suite on the macOS runner, once a night against main.
# CI runs only the @macos tests there (ci.yml), so a release never waits on the
# one Mac runner for a serial full run. A Mac-only regression is caught here
# within a day instead: a failure opens an issue labelled `macos-nightly`, or
# comments on the open one, and a later green run closes it.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: macos-nightly
  cancel-in-progress: false

env:
  ELECTRON_BUILDER_SKIP_REBUILD: '1'
  PHOSPHOR_E2E_SHOW: '0'

jobs:
  e2e:
    name: E2E full suite (macOS)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (node-pty)
        run: npm run rebuild --prefix apps/desktop

      - name: Build
        run: npm run build

      - name: E2E (macOS, whole suite)
        run: npx playwright test --config apps/desktop/playwright.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-macos-nightly
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7

  report:
    name: Open or close the nightly issue
    needs: e2e
    if: always() && github.event_name == 'schedule'
    # GitHub-hosted: a one-call script should not queue behind CI on our runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const label = 'macos-nightly'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, labels: label, state: 'open', per_page: 1,
            })
            const issue = open[0]
            if (process.env.RESULT === 'success') {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Green again: ${run}` })
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' })
              }
              return
            }
            if (process.env.RESULT !== 'failure') return
            const body = `The macOS nightly e2e run failed on main (${context.sha.slice(0, 9)}): ${run}`
            if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'macOS nightly e2e is failing', labels: [label], body })
            }
