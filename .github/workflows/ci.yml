name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # electron-builder's postinstall isn't needed for checks and slows CI down.
  ELECTRON_BUILDER_SKIP_REBUILD: '1'

# Every job runs on the project's own runners: two Linux (x64) and one macOS
# (ARM64), each taking one job at a time. Jobs on the same OS queue, so a job is
# split only where the split pays for its extra checkout and `npm ci`; adding
# runner instances is what buys back parallelism.
jobs:
  checks:
    name: Typecheck · size ratchet
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      # Only the unit and e2e jobs launch Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The comprehensive typecheck includes the site's independent
      # TypeScript/Astro installation.
      - name: Install site dependencies
        run: npm ci --prefix apps/site

      # Includes the all-file coverage audit, Host, Control and the site check.
      - name: Typecheck
        run: npm run typecheck

      - name: Size ratchet
        run: node tools/scripts/size-budget.mjs check

  lint:
    name: Lint · format
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint (syntax-only), oxlint's type-aware promise rules, dead mocks.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

  build:
    name: Build · Desktop · Web · Host · Control
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (main · preload · renderer)
        run: npm run build

      - name: Build (web)
        run: npm run web:build

      - name: Build (host)
        run: npm run build:host

      - name: Build (control)
        run: npm run build:control

  unit:
    name: Unit tests
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci's electron postinstall downloads the Electron zip on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # The typecheck coverage audit's own unit test reads the site's install.
      - name: Install site dependencies
        run: npm ci --prefix apps/site

      - name: Unit tests
        run: npm test

  web-e2e:
    name: Web · ${{ matrix.browser }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      WEB_E2E_EVIDENCE: /tmp/phosphor-web-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The runners carry the browsers' system libraries (installed once with
      # `sudo npx playwright install-deps`); the runner user has no sudo.
      - name: Install ${{ matrix.browser }}
        run: npx playwright install ${{ matrix.browser }}
      - name: Browser acceptance (${{ matrix.browser }})
        run: npm run test:e2e:web -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-results-${{ matrix.browser }}
          path: /tmp/phosphor-web-e2e/results/
          retention-days: 7

  control-schema:
    name: Control schema · local Supabase · RLS
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # For the sign-in test below, which runs Desktop's account code (vitest).
      - name: Install dependencies
        run: npm ci
      # A dedicated local project, never linked to a hosted database. Suppress
      # the CLI's development-key output; startup errors still reach stderr.
      - name: Start isolated Supabase
        run: npm run db:start --silent > /dev/null
      - name: Database authorization tests
        run: npm run test:control-db
      # Real Supabase Auth, GitHub played by a local fixture container.
      - name: Desktop sign-in against Supabase Auth
        run: npm run test:auth-stack
      - name: Control API against Supabase
        run: npm run test:control-stack
      - name: Remove only this test stack
        if: always()
        run: npm run db:stop

  site:
    # phosphor.saccolabs.com is deployed from main by deploy-site.yml, which
    # only runs after a merge — this catches a broken page on the PR instead.
    name: Site · astro check · build · browser checks
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix apps/site

      - name: Install browser
        working-directory: apps/site
        run: npx playwright install chromium

      - name: Combined image API and browser checks
        run: bash tools/scripts/site-image.sh

      # Successful evidence is opt-in: label the PR before its next push.
      - uses: actions/upload-artifact@v4
        if: failure() || contains(github.event.pull_request.labels.*.name, 'keep-ci-artifacts')
        with:
          name: site-browser-evidence
          path: apps/site/test-results/
          retention-days: 3

  # Windows packaging and the packaged-app smoke are paused to save CI time; the
  # Windows release build is paused with them (release-continuous.yml). They come
  # back in a later release: restore this job from git history (it built the NSIS
  # installer, checked latest.yml and booted the packaged app with an npm pi).

  # Linux runs the whole Desktop suite on every event. macOS runs the whole suite
  # on main, which gates every release (release-continuous.yml waits for this
  # workflow), and on a PR only the tests tagged @macos: native quit, undo,
  # context menus, Meta shortcuts, the system clipboard and the login shell.
  e2e:
    name: E2E smoke (${{ matrix.os }} ${{ matrix.shard }})
    runs-on: ${{ matrix.os == 'macos' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One leg per runner. The suite has no cross-test ordering or shared
        # state (fullyParallel, workers 1), so with more runner instances the
        # legs can split again with --shard.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"linux","shard":"1/1"},{"os":"macos","shard":"1/1"}]' || '[{"os":"linux","shard":"1/1"},{"os":"macos","shard":"1/1","grep":"@macos"}]') }}
    env:
      # Map the windows. Chromium barely renders a window that was never
      # shown, which made every test 2-5x slower. The windows land on xvfb or
      # the macOS runner's login session. The first-test click
      # timeouts were Electron's first launch on a fresh runner, which never
      # paints: apps/desktop/e2e/warm-up.ts absorbs it.
      # Linux only. macOS renders hidden windows at full speed, and the Mac is a
      # shared machine: hidden windows never appear on its screen or take focus.
      PHOSPHOR_E2E_SHOW: ${{ matrix.os == 'linux' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci's electron postinstall downloads the Electron zip on every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (node-pty)
        run: npm run rebuild --prefix apps/desktop

      - name: Build
        run: npm run build

      # `apps/desktop/scripts/__tests__/adhoc-sign-mac.test.ts` is `skipIf(platform !==
      # 'darwin')` — codesign exists nowhere else — so the ubuntu unit-test job
      # skips it. That is how a signer that fails its own verification merged
      # green and killed every macOS release build for a day. The suite takes
      # well under a second.
      - name: Unit tests (macOS-only suites)
        if: runner.os == 'macOS' && startsWith(matrix.shard, '1/')
        run: npx vitest run apps/desktop/scripts/__tests__/adhoc-sign-mac.test.ts

      # The Electron window needs a display server on Linux runners.
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npx playwright test --config apps/desktop/playwright.config.ts --shard=${{ matrix.shard }}

      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test --config apps/desktop/playwright.config.ts --shard=${{ matrix.shard }} ${{ matrix.grep && format('--grep {0}', matrix.grep) || '' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7

  # The one required status check. Branch rules name this job instead of every
  # matrix leg, so shard counts and platforms can change without editing them.
  result:
    name: CI result
    if: always()
    needs: [checks, lint, build, unit, control-schema, site, e2e, web-e2e]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job ended $r"; exit 1; }; done
