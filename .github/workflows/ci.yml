name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # electron-builder's postinstall isn't needed for checks and slows CI down.
  ELECTRON_BUILDER_SKIP_REBUILD: '1'

jobs:
  checks:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both the comprehensive typecheck and its coverage audit unit test need
      # the site's independent TypeScript/Astro installation.
      - name: Install site dependencies
        run: npm ci --prefix apps/site

      - name: Shadow affected report (never skips checks)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { shadowSelection } = await import(`${process.env.GITHUB_WORKSPACE}/tools/scripts/ci-selection.mjs`)
              console.log(JSON.stringify(await shadowSelection(context, github)))
            } catch {
              console.log(JSON.stringify({ mode: 'full', reason: 'shadow adapter failed', base: null, head: context.sha,
                projects: ['control', 'desktop', 'host', 'pi-extensions', 'runtime', 'schema', 'shared', 'site', 'tooling'] }))
            }

      # Includes the all-file coverage audit, Host, Control and the site check.
      - name: Typecheck
        run: npm run typecheck

      - name: Size ratchet
        run: node tools/scripts/size-budget.mjs check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Unit tests
        run: npm test

      - name: Build (main · preload · renderer)
        run: npm run build

      - name: Build (host)
        run: npm run build:host

      - name: Build (control)
        run: npm run build:control

  control-schema:
    name: Control schema · local Supabase · RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # For the sign-in test below, which runs Desktop's account code (vitest).
      - name: Install dependencies
        run: npm ci
      # A dedicated local project, never linked to a hosted database. Suppress
      # the CLI's development-key output; startup errors still reach stderr.
      - name: Start isolated Supabase
        run: npm run db:start --silent > /dev/null
      - name: Database authorization tests
        run: npm run test:control-db
      # Real Supabase Auth, GitHub played by a local fixture container.
      - name: Desktop sign-in against Supabase Auth
        run: npm run test:auth-stack
      - name: Control API against Supabase
        run: npm run test:control-stack
      - name: Remove only this test stack
        if: always()
        run: npm run db:stop

  site:
    # phosphor.saccolabs.com is deployed from main by deploy-site.yml, which
    # only runs after a merge — this catches a broken page on the PR instead.
    name: Site · astro check · build · browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix apps/site

      - name: Install browser
        working-directory: apps/site
        run: npx playwright install --with-deps chromium

      - name: Combined image API and browser checks
        run: bash tools/scripts/site-image.sh

      # Successful evidence is opt-in: label the PR before its next push.
      - uses: actions/upload-artifact@v4
        if: failure() || contains(github.event.pull_request.labels.*.name, 'keep-ci-artifacts')
        with:
          name: site-browser-evidence
          path: apps/site/test-results/
          retention-days: 3

  # Windows packaging and the packaged-app smoke are paused to save CI time; the
  # Windows release build is paused with them (release-continuous.yml). They come
  # back in a later release: restore this job from git history (it built the NSIS
  # installer, checked latest.yml and booted the packaged app with an npm pi).

  e2e:
    name: E2E smoke (${{ matrix.os }} ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sharded per test (fullyParallel, workers 1): the suite has no
          # cross-test ordering or shared state. The repo is public, so extra
          # runners cost wall time only for their ~1.5 min setup; six ubuntu
          # shards and two macOS shards bring the slowest job from ~14 to ~7 min.
          - { os: ubuntu-latest, shardIndex: 1, shardTotal: 6 }
          - { os: ubuntu-latest, shardIndex: 2, shardTotal: 6 }
          - { os: ubuntu-latest, shardIndex: 3, shardTotal: 6 }
          - { os: ubuntu-latest, shardIndex: 4, shardTotal: 6 }
          - { os: ubuntu-latest, shardIndex: 5, shardTotal: 6 }
          - { os: ubuntu-latest, shardIndex: 6, shardTotal: 6 }
          - { os: macos-latest, shardIndex: 1, shardTotal: 2 }
          - { os: macos-latest, shardIndex: 2, shardTotal: 2 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci's electron postinstall downloads the Electron zip on every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (node-pty)
        run: npm run rebuild --prefix apps/desktop

      - name: Build
        run: npm run build

      # `apps/desktop/scripts/__tests__/adhoc-sign-mac.test.ts` is `skipIf(platform !==
      # 'darwin')` — codesign exists nowhere else — so the ubuntu unit-test job
      # skips it and CI never ran it at all. That is how a signer that fails
      # its own verification merged green and killed every macOS release build
      # for a day. This is the only macOS runner in CI; the suite takes well
      # under a second.
      - name: Unit tests (macOS-only suites)
        if: runner.os == 'macOS' && matrix.shardIndex == 1
        run: npx vitest run apps/desktop/scripts/__tests__/adhoc-sign-mac.test.ts

      # The Electron window needs a display server on Linux runners.
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npx playwright test --config apps/desktop/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test --config apps/desktop/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shardIndex }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7

  # The one required status check. Branch rules name this job instead of every
  # matrix leg, so shard counts and platforms can change without editing them.
  result:
    name: CI result
    if: always()
    needs: [checks, control-schema, site, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job ended $r"; exit 1; }; done
