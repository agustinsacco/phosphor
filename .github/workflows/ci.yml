name: CI
on:
  pull_request:
jobs:
  probe:
    name: probe ${{ matrix.n }} show=${{ matrix.show }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
        show: ['1', '0']
    env:
      PHOSPHOR_E2E_SHOW: ${{ matrix.show }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run rebuild --prefix apps/desktop
      - run: npm run build
      - name: session A
        run: PROBE_LABEL=A xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npx playwright test --config apps/desktop/playwright.config.ts zz-frame-probe --retries=0
      - name: session B
        run: PROBE_LABEL=B xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npx playwright test --config apps/desktop/playwright.config.ts zz-frame-probe --retries=0
      - name: real first test, fresh xvfb
        if: always()
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npx playwright test --config apps/desktop/playwright.config.ts remote-pages.spec.ts:233 account.spec.ts:6 --retries=0
