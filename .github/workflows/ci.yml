name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # electron-builder's postinstall isn't needed for checks and slows CI down.
  ELECTRON_BUILDER_SKIP_REBUILD: '1'

jobs:
  checks:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Unit tests
        run: npm test

      - name: Build (main · preload · renderer)
        run: npm run build

  site:
    # phosphor.saccolabs.com is deployed from main by deploy-site.yml, which
    # only runs after a merge — this catches a broken page on the PR instead.
    name: Site · astro check · build · browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Astro check
        run: npm run check --prefix site

      - name: Build site
        run: npm run build --prefix site

      - name: Install browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Build production site image
        run: docker build -t phosphor-site-ci ./site

      - name: Serve production image
        run: |
          docker run -d --name phosphor-site-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /var/cache/nginx:rw,uid=101,gid=101 --tmpfs /tmp:rw,uid=101,gid=101 \
            -p 127.0.0.1:4322:5015 phosphor-site-ci
          # --retry-all-errors, not --retry-connrefused: Docker's port forward
          # accepts and then resets the connection (curl exit 56) while nginx
          # is still starting, and --retry-connrefused does not retry that.
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:4322/ -o /dev/null

      - name: Browser checks (desktop, mobile, no JS, reduced motion)
        env:
          SITE_TEST_URL: http://127.0.0.1:4322
        run: npm test --prefix site

      - name: Stop production image
        if: always()
        run: docker rm -f phosphor-site-ci || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-evidence
          path: site/test-results/
          retention-days: 7

  windows:
    # The only Windows runner in CI. Its job is to catch what no other runner
    # can: that `electron-builder --win` still produces the NSIS installer and
    # its update manifest, and that the PACKAGED app boots on Windows and runs
    # an npm-installed pi — which reaches pi through node.exe + cli.js, not the
    # `.cmd` shim Node refuses to spawn (electron/pi/win-launch.ts). The full
    # unit and e2e suites stay on ubuntu/macOS; this runs in parallel with
    # them and finishes inside the e2e shards' wall time.
    name: Windows · package · packaged-app smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder downloads Electron and NSIS on every run otherwise.
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # The Windows-facing suites, on Windows. `win-launch.test.ts` runs
      # everywhere; here it also proves node:path's win32 branch agrees with
      # the host.
      - name: Unit tests (Windows launcher, PATH handling)
        run: npx vitest run electron/pi/win-launch.test.ts electron/pi/shell-env.test.ts

      - name: Build (main · preload · renderer)
        run: npm run build

      # Same invocation as release-continuous.yml minus `--publish`: the
      # native rebuild (node-pty against Electron's ABI), the NSIS pass and
      # latest.yml all run for real.
      - name: Package (electron-builder --win)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npx electron-builder --win --publish never
          ls release
          [ -f release/Phosphor-0.1.0-x64.exe ] || { echo "::error::installer missing"; exit 1; }
          [ -f release/latest.yml ] || { echo "::error::latest.yml missing"; exit 1; }

      # pi from npm, exactly as a user installs it, then the packaged app.
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Boot the packaged app and run pi
        run: pwsh scripts/smoke-packaged-win.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: release/Phosphor-*-x64.exe
          retention-days: 7

  e2e:
    name: E2E smoke (${{ matrix.os }} ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sharded 3-way: the ubuntu (xvfb) run is CI's longest single step,
          # and the suite's 33 tests have no cross-test ordering or shared
          # state, so splitting them across jobs is safe.
          - os: ubuntu-latest
            shardIndex: 1
            shardTotal: 3
          - os: ubuntu-latest
            shardIndex: 2
            shardTotal: 3
          - os: ubuntu-latest
            shardIndex: 3
            shardTotal: 3
          # macOS runner-minutes bill at a much higher multiplier, and this
          # job isn't the critical path — left unsharded.
          - os: macos-latest
            shardIndex: 1
            shardTotal: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (node-pty)
        run: npx electron-rebuild -f -w node-pty

      - name: Build
        run: npm run build

      # `scripts/__tests__/adhoc-sign-mac.test.ts` is `skipIf(platform !==
      # 'darwin')` — codesign exists nowhere else — so the ubuntu unit-test job
      # skips it and CI never ran it at all. That is how a signer that fails
      # its own verification merged green and killed every macOS release build
      # for a day. This is the only macOS runner in CI; the suite takes well
      # under a second.
      - name: Unit tests (macOS-only suites)
        if: runner.os == 'macOS'
        run: npx vitest run scripts/__tests__/adhoc-sign-mac.test.ts

      # The Electron window needs a display server on Linux runners.
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
