name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            script: dist:mac
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
          - os: windows-latest
            name: Windows
            script: dist:win
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AppImage/deb tooling and arm64 cross-build support.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm

      - name: Build and package
        # This matrix includes windows-latest, where the default shell is
        # PowerShell; the guard below is POSIX sh.
        shell: bash
        run: |
          set -euo pipefail
          # The Mac certificate must never reach the Windows runner:
          # electron-builder's Windows signer reads WIN_CSC_LINK and falls back
          # to CSC_LINK, so it would try to Authenticode-sign with an Apple
          # .p12 and fail. Same rule as release-continuous.yml.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          # An EMPTY CSC_LINK is worse than an absent one: electron-builder reads
          # it as a certificate PATH, resolves it to the project dir, and dies
          # with "<projectDir> not a file". Missing secrets arrive as empty
          # strings, so unset them rather than pass them through.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing/notarization run only when the secrets exist; unsigned otherwise.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and generate checksums
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.exe' \) \
            -exec cp {} release/ \;
          cp scripts/install.sh release/install.sh
          cp build/icon.png release/icon.png
          cd release
          sha256sum * > checksums.txt
          echo '--- release contents ---'
          cat checksums.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release/*
          body: |
            ## Install

            macOS / Linux:

            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```

            Windows: download the `.exe` installer below.

            Phosphor requires the pi coding agent on your PATH:

            ```sh
            npm install -g @earendil-works/pi-coding-agent
            ```
