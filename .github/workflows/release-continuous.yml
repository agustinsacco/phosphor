name: Continuous Release

# Every green CI run on main that changes the Desktop app (Nx `desktop`
# affected since the last published release) publishes an installable release.
#
# Triggered by `workflow_run` rather than `push` so this can NEVER publish from
# a red build: the job is only reachable once the CI workflow has already
# reported success. It also means the test matrix is not duplicated here.
#
# Manual retries also require successful exact-SHA main CI. This is the only
# release entry point; pushing a tag does not start another packaging pipeline.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only eligible main runs may cancel a release. Concurrency is evaluated
  # before the job guard; failed CI and rejected manual refs need unique groups.
  group: release-${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  guard:
    name: Decide whether to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release == 'true' && steps.scope.outputs.desktop != 'false' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run events check out the default branch by default; pin to
          # the exact commit CI validated so the release matches what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # `git rev-list --count` needs real history, not a depth-1 clone.
          fetch-depth: 0

      - name: Verify manual release CI
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            if (context.ref !== 'refs/heads/main' ||
                execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== context.sha) {
              throw new Error('Manual releases require the exact main checkout')
            }
            const request = { ...context.repo, workflow_id: 'ci.yml' }
            const { data: workflow } = await github.rest.actions.getWorkflow(request)
            if (workflow.path !== '.github/workflows/ci.yml' || workflow.name !== 'CI' || !Number.isInteger(workflow.id)) {
              throw new Error('Cannot verify CI workflow identity')
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...request, branch: 'main', event: 'push', head_sha: context.sha, per_page: 100,
            })
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const runs = data.workflow_runs.filter(run =>
              run.workflow_id === workflow.id && run.path === workflow.path && run.name === 'CI' &&
              run.repository?.full_name === repository && run.head_repository?.full_name === repository &&
              run.event === 'push' && run.head_branch === 'main' && run.head_sha === context.sha)
            runs.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)
            if (runs[0]?.status !== 'completed' || runs[0]?.conclusion !== 'success') {
              throw new Error('Wait for successful exact-SHA main CI before retrying the release')
            }

      - name: Compute version and check for an existing tag
        id: decide
        env:
          # A `Skip-Release: true` trailer merges without shipping.
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail

          # 0.1.<commits on this history>: semver-valid and strictly increasing,
          # with no version-bump commit back to main (which would re-trigger CI).
          VERSION="0.1.$(git rev-list --count HEAD)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # A git trailer, not a marker in prose — see
          # tools/scripts/should-skip-release.test.ts. Two prose-matching
          # attempts each suppressed their OWN release by talking about the
          # marker: whole-message lost v0.1.37, subject-only lost v0.1.38.
          # The current workflow may check out a CI commit from before relocation.
          SKIP_SCRIPT=tools/scripts/should-skip-release.sh
          if [[ ! -f "$SKIP_SCRIPT" ]]; then SKIP_SCRIPT=scripts/should-skip-release.sh; fi
          if [[ ! -f "$SKIP_SCRIPT" ]]; then
            echo "::error::Skip-release guard is missing from the validated checkout." >&2
            exit 1
          fi
          if sh "$SKIP_SCRIPT" "${HEAD_MESSAGE:-$(git log -1 --format=%B)}"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip-Release trailer present — not publishing ${TAG}."
            exit 0
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              echo "::error::Skip-release guard failed (${status})." >&2
              exit "$status"
            fi
          fi

          # Re-runs and workflow_dispatch replays land on an existing tag. Skip
          # rather than fail: a duplicate is not an error worth a red X.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} already exists — nothing to publish."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing ${TAG}."

      # Only a Desktop change is worth an update prompt. Site, schema, docs and
      # CI-only merges stop here (the site deploys from deploy-site.yml). It is
      # Nx's `desktop` project, affected since the last PUBLISHED release, so a
      # newer push cancelling this run cannot strand a Desktop change. Every
      # doubt releases. An explicit workflow_dispatch always releases.
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.should_release == 'true' && github.event_name == 'workflow_run'
        with:
          node-version: 22
          cache: npm

      - name: Release only when Desktop changed since the last release
        id: scope
        if: steps.decide.outputs.should_release == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Root install only: Nx reads project.json files, not the Electron tree.
          # A checkout from before this helper keeps the old always-release rule.
          if [[ ! -f tools/scripts/release-scope.mjs ]] || ! npm ci --ignore-scripts --no-audit --no-fund; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          SCOPE=$(node tools/scripts/release-scope.mjs "${RELEASED}")
          echo "${SCOPE}"
          if [[ "$(jq -r .release <<<"${SCOPE}")" == false ]]; then
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Desktop unchanged since ${RELEASED} — not publishing."
          else
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          fi

      # Create once before parallel publishers to avoid GitHub's create race.
      # A retry may reuse only a draft for this exact SHA. Failed builds stay
      # invisible to users until all platforms pass and finalize publishes it.
      - name: Pre-create the draft release
        if: steps.decide.outputs.should_release == 'true' && steps.scope.outputs.desktop != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.decide.outputs.tag }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json"; then
            jq -e --arg sha "$SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --draft --target "$SHA" --title "$TAG" --notes "Building…"
          fi

  build:
    name: Build and publish ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Finish all platforms for diagnostics, but keep failures in draft.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            # BOTH mac arches in ONE electron-builder invocation. Splitting them
            # across jobs makes the second upload clobber the first's
            # latest-mac.yml, which silently breaks auto-update.
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
          # Windows (NSIS x64 installer + latest.yml, `args: --win`) is paused to
          # save CI time and returns in a later release. Its signing block and
          # installer check below are inert until the matrix entry comes back;
          # re-add the exe, latest.yml and checksum entries in finalize too.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AppImage/deb tooling and arm64 cross-build support.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm

      - name: Build renderer and main
        run: npm run build

      # electron-builder's own GitHub publisher, not a hand-rolled upload: it is
      # what generates latest-mac.yml / latest-linux.yml (the version + sha512
      # manifests electron-updater polls) and the .blockmap files that make
      # updates differential instead of a full ~100MB re-download.
      - name: Package and publish
        # The Windows runner's default shell is PowerShell; everything below is
        # bash (arrays, `set -u`, `[ ]`), so pin it on every platform.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing/notarization run only when the secrets exist; unsigned
          # otherwise. `phosphorSigned` tells the app which update path it can
          # offer — see electron/updates/updater.ts.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode, when a certificate exists. Separate secrets
          # from the Mac ones on purpose — see the Windows block below.
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNED=false
          if [ "${RUNNER_OS}" = "macOS" ] && [ -n "${CSC_LINK:-}" ]; then
            SIGNED=true
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # AppImage self-updates without any signing requirement.
            SIGNED=true
          fi
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # electron-builder's Windows signer reads WIN_CSC_LINK and FALLS
            # BACK to CSC_LINK, so the Mac .p12 above must never reach this
            # runner: it would try to Authenticode-sign the installer with an
            # Apple certificate and fail the build.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # NSIS installs self-update signed or not: electron-updater only
            # verifies the downloaded installer's signature when the running
            # app has a publisherName to compare against, which an unsigned
            # build does not. SmartScreen's "unknown publisher" interstitial
            # is the only cost of shipping unsigned here.
            SIGNED=true
          fi
          # An EMPTY CSC_LINK is worse than an absent one: electron-builder reads
          # it as a certificate PATH, resolves it to the project dir, and dies
          # with "<projectDir> not a file". Missing secrets arrive as empty
          # strings, so unset them rather than pass them through.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          # `hardenedRuntime` is false in electron-builder.yml because it cannot
          # be satisfied by the ad-hoc signature apps/desktop/scripts/adhoc-sign-mac.mjs
          # applies. With a real Developer ID it is required for notarization,
          # so turn it back on for exactly that case.
          HARDENED=()
          if [ "${RUNNER_OS}" = "macOS" ] && [ "${SIGNED}" = "true" ]; then
            HARDENED=(--config.mac.hardenedRuntime=true)
          fi
          # `"${HARDENED[@]}"` alone dies with "HARDENED[@]: unbound
          # variable" under `set -u` on an empty array — that is macOS's own
          # /bin/bash (3.2.57, last-GPLv2, never upgraded by Apple); bash 4.4+
          # treats an empty array as zero words instead of unset. This is the
          # unsigned path (no MAC_CERT_P12), which is every macOS build this
          # repo has run so far, so it failed 100% of the time and every
          # continuous release shipped Linux-only — no .dmg, no .zip, no
          # latest-mac.yml (v0.1.93 and presumably others). The
          # `${arr[@]+"${arr[@]}"}` idiom expands to nothing when the array is
          # empty and to the real words otherwise, and is nounset-safe on both
          # bash 3.2 and 4.4+.
          npm run package --prefix apps/desktop -- ${{ matrix.args }} --publish always \
            "${HARDENED[@]+"${HARDENED[@]}"}" \
            --config.extraMetadata.version="${{ needs.guard.outputs.version }}" \
            --config.extraMetadata.phosphorSigned="${SIGNED}" \
            --config.publish.provider=github \
            --config.publish.releaseType=draft

      # A malformed signature must fail the build that produced it. v0.1.90
      # shipped a bundle whose signature claimed sealed resources it did not
      # have, and nothing in CI noticed — the first report was a user seeing
      # "damaged and can't be opened". `--verify` catches exactly that; it
      # passes for both an ad-hoc and a Developer ID signature, so this guard
      # holds whether or not the certificate secrets are configured.
      - name: Verify the macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          FOUND=0
          for APP in apps/desktop/release/mac*/Phosphor.app; do
            [ -d "$APP" ] || continue
            FOUND=1
            echo "== $APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Identifier=|flags=|Sealed' || true
            codesign --verify --deep --strict "$APP"
            echo "   signature verified"
          done
          [ "$FOUND" -eq 1 ] || { echo "::error::no packaged .app found to verify"; exit 1; }

      # The installer must exist under the exact name install docs, checksums
      # and the finalize job's asset check use, and latest.yml — the manifest
      # electron-updater polls on Windows — must name the same file. A publish
      # that uploaded one without the other would leave every Windows install
      # unable to self-update, silently.
      - name: Verify the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          EXE="apps/desktop/release/Phosphor-${VERSION}-x64.exe"
          [ -f "$EXE" ] || { echo "::error::${EXE} was not produced"; ls apps/desktop/release; exit 1; }
          [ -f "apps/desktop/release/latest.yml" ] || { echo "::error::apps/desktop/release/latest.yml was not produced"; exit 1; }
          grep -q "^version: ${VERSION}$" apps/desktop/release/latest.yml || { echo "::error::latest.yml does not carry ${VERSION}"; cat apps/desktop/release/latest.yml; exit 1; }
          grep -q "Phosphor-${VERSION}-x64.exe" apps/desktop/release/latest.yml || { echo "::error::latest.yml does not reference ${EXE}"; cat apps/desktop/release/latest.yml; exit 1; }
          echo "   $(du -h "$EXE" | cut -f1) installer, manifest names it"

  finalize:
    name: Attach installer script and notes
    needs: [guard, build]
    # Never replace a complete latest release with a partial or unverified one.
    if: ${{ success() && needs.guard.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # generate-notes resolves each commit to its pull request.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # install.sh verifies its download against this file. Without it every
      # install prints "checksums.txt not published — continuing without
      # verification", which is a poor first impression for a curl | sh flow.
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          mkdir -p checksums
          cd checksums
          gh release download "$TAG" \
            --pattern '*.AppImage' --pattern '*.deb' \
            --pattern '*.dmg' --pattern '*.zip'
          sha256sum * > checksums.txt
          gh release upload "$TAG" checksums.txt --clobber

      # install.sh builds asset names by hand, and electron-builder expands
      # `${arch}` per TARGET (-x64.dmg but -x86_64.AppImage), so the two drift
      # silently: v0.1.39-v0.1.48 all shipped an AppImage the installer could
      # not name, and `curl | sh` 404'd for every Linux user. Ask the script
      # itself what it would fetch and assert the release has it.
      - name: Verify install.sh can resolve its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          VERSION="${{ needs.guard.outputs.version }}"
          AVAILABLE=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$AVAILABLE"
          # Mirrors the mapping in tools/scripts/install.sh — keep both in step.
          MISSING=0
          for EXPECTED in \
            "Phosphor-${VERSION}-x86_64.AppImage" \
            "Phosphor-${VERSION}-arm64.AppImage" \
            "Phosphor-${VERSION}-x64.dmg" \
            "Phosphor-${VERSION}-arm64.dmg" \
            "Phosphor-${VERSION}-amd64.deb" \
            "Phosphor-${VERSION}-arm64.deb" \
            "Phosphor-${VERSION}-mac.zip" \
            "Phosphor-${VERSION}-arm64-mac.zip" \
            "latest-mac.yml" "latest-linux.yml" "latest-linux-arm64.yml"; do
            if ! grep -qx "$EXPECTED" <<<"$AVAILABLE"; then
              echo "::error::Required release asset ${EXPECTED} is missing."
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "install.sh asset names match the release."

      # install.sh downloads assets by exact name, so it ships with the release
      # it installs. Uploaded after the builds so it cannot race them.
      - name: Upload install.sh and icon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.guard.outputs.tag }}" \
            tools/scripts/install.sh apps/desktop/build/icon.png --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          VERSION="${{ needs.guard.outputs.version }}"
          TAG="${{ needs.guard.outputs.tag }}"
          REPO="${{ github.repository }}"

          # List every PR since the last PUBLISHED release, not the previous
          # commit: Skip-Release merges and cancelled runs ship in this build,
          # so they belong in its notes. This release is still a draft here,
          # so releases/latest is the one before it. A failed lookup publishes
          # the install notes alone rather than holding back a verified build.
          PREVIOUS=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)
          ARGS=(-f "tag_name=${TAG}" -f "target_commitish=${SHA}")
          if [[ -n "${PREVIOUS}" && "${PREVIOUS}" != "${TAG}" ]]; then
            ARGS+=(-f "previous_tag_name=${PREVIOUS}")
          fi
          if ! CHANGES=$(gh api --method POST "repos/${REPO}/releases/generate-notes" "${ARGS[@]}" --jq .body); then
            echo "::warning::Could not generate the change list for ${TAG}; publishing install notes only."
            CHANGES=""
          fi

          NOTES=$(printf '%s\n' \
            "Automatic release from \`main\` @ \`${SHA:0:7}\`." \
            "" \
            "${CHANGES}" \
            "" \
            "## Install" \
            "" \
            "macOS / Linux:" \
            "" \
            '```sh' \
            "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh" \
            '```' \
            "" \
            "This replaces an existing install in place." \
            "" \
            "Windows builds are paused for now and will return in a later release." \
            "" \
            "Already running Phosphor? It will offer to update itself." \
            "" \
            "Phosphor requires the pi coding agent on your PATH:" \
            "" \
            '```sh' \
            "npm install -g @earendil-works/pi-coding-agent" \
            '```')
          # electron-builder creates the release as a draft; publishing it here
          # (after every asset is attached) is what makes `releases/latest`
          # resolve to it — which is exactly what the updater and install.sh use.
          gh release edit "${TAG}" \
            --draft=false --latest --notes "${NOTES}"
