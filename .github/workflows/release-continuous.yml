name: Continuous Release

# Every green CI run on main publishes an installable release.
#
# Triggered by `workflow_run` rather than `push` so this can NEVER publish from
# a red build: the job is only reachable once the CI workflow has already
# reported success. It also means the test matrix is not duplicated here.
#
# NOTE: GitHub only evaluates `workflow_run` triggers from the copy of this
# file on the DEFAULT branch, so this cannot fire until it is merged to main.
# `workflow_dispatch` exists to dry-run the whole build-and-publish path from a
# feature branch before that happens.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Rapid merges cancel superseded release builds — the newest commit wins and
  # a skipped intermediate version number is harmless. That is the intent for
  # actual main-targeted release attempts ONLY: this workflow's `workflow_run`
  # trigger fires for every completed run of the CI workflow, on any branch,
  # and the concurrency claim happens before `guard`'s own `if:` gets to
  # filter those out. A static `release-main` group let a PR branch's own CI
  # completion cancel an in-flight main release build outright (v0.1.60 lost
  # this way to an unrelated branch's CI, mid `electron-builder` package step —
  # not a skip, a cancellation). Runs that will not touch main now key off
  # their own run id, so they can never collide with `release-main`.
  group: release-${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main') && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  guard:
    name: Decide whether to release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run events check out the default branch by default; pin to
          # the exact commit CI validated so the release matches what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # `git rev-list --count` needs real history, not a depth-1 clone.
          fetch-depth: 0

      - name: Compute version and check for an existing tag
        id: decide
        env:
          # A `Skip-Release: true` trailer merges without shipping.
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail

          # 0.1.<commits on this history>: semver-valid and strictly increasing,
          # with no version-bump commit back to main (which would re-trigger CI).
          VERSION="0.1.$(git rev-list --count HEAD)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # A git trailer, not a marker in prose — see
          # scripts/should-skip-release.test.ts. Two prose-matching
          # attempts each suppressed their OWN release by talking about the
          # marker: whole-message lost v0.1.37, subject-only lost v0.1.38.
          if sh scripts/should-skip-release.sh "${HEAD_MESSAGE:-}"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip-Release trailer present — not publishing ${TAG}."
            exit 0
          fi

          # Re-runs and workflow_dispatch replays land on an existing tag. Skip
          # rather than fail: a duplicate is not an error worth a red X.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} already exists — nothing to publish."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing ${TAG}."

      # The macOS, Linux and Windows `build` jobs below all run
      # `electron-builder --publish always` in parallel, and each
      # independently asks GitHub "does a release for this tag exist yet? if
      # not, create it" before uploading. When both land on "not yet" at the
      # same moment, the loser's create-call 422s — either "already_exists" on
      # tag_name, or the oddly worded "Published releases must have a valid
      # tag" — and electron-builder appears to re-run that check per asset
      # upload, not once per job, so the failure mode ranges from "one
      # platform ships nothing" (v0.1.62, v0.1.65 lost this way on macOS) to a
      # partially-uploaded platform (v0.1.61 shipped only one of four macOS
      # binaries and neither .deb). Creating the draft release once, here,
      # sequentially, before either matrix job starts, means every later
      # "does it exist" check from either platform's electron-builder answers
      # "yes" and goes straight to uploading — which each already does
      # correctly and without clobbering the others' files.
      #
      # Uses the same `gh release create` → `POST .../releases` endpoint
      # electron-builder's own publisher calls, so this is not a different
      # code path from the one already relied on when a job retries against
      # an existing release — just the first path both jobs take instead of
      # only the race's winner. Left as a draft with throwaway notes;
      # `finalize` overwrites both once every asset is attached, and a draft
      # never appears on `releases/latest`, so this is invisible to users even
      # if `finalize` never ran.
      #
      # Deliberately non-fatal: a failure here (permissions hiccup, transient
      # network) falls back to today's behavior — both jobs race to create it
      # themselves — rather than blocking either platform from building.
      - name: Pre-create the draft release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.decide.outputs.tag }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          if ! gh release create "$TAG" --draft --target "$SHA" --title "$TAG" \
            --notes "Building…"; then
            echo "::notice::could not pre-create ${TAG} — build jobs will race to create it as before."
          fi

  build:
    name: Build and publish ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel a finished platform because the other one failed: a
      # half-published release is still installable on the platform that built.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            # BOTH mac arches in ONE electron-builder invocation. Splitting them
            # across jobs makes the second upload clobber the first's
            # latest-mac.yml, which silently breaks auto-update.
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
          - os: windows-latest
            name: Windows
            # NSIS x64 installer + latest.yml. Unsigned unless WIN_CERT_PFX is
            # configured; see the signing block below.
            args: --win
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AppImage/deb tooling and arm64 cross-build support.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm

      - name: Build renderer and main
        run: npm run build

      # electron-builder's own GitHub publisher, not a hand-rolled upload: it is
      # what generates latest-mac.yml / latest-linux.yml (the version + sha512
      # manifests electron-updater polls) and the .blockmap files that make
      # updates differential instead of a full ~100MB re-download.
      - name: Package and publish
        # The Windows runner's default shell is PowerShell; everything below is
        # bash (arrays, `set -u`, `[ ]`), so pin it on every platform.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing/notarization run only when the secrets exist; unsigned
          # otherwise. `phosphorSigned` tells the app which update path it can
          # offer — see electron/updates/updater.ts.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode, when a certificate exists. Separate secrets
          # from the Mac ones on purpose — see the Windows block below.
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNED=false
          if [ "${RUNNER_OS}" = "macOS" ] && [ -n "${CSC_LINK:-}" ]; then
            SIGNED=true
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # AppImage self-updates without any signing requirement.
            SIGNED=true
          fi
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # electron-builder's Windows signer reads WIN_CSC_LINK and FALLS
            # BACK to CSC_LINK, so the Mac .p12 above must never reach this
            # runner: it would try to Authenticode-sign the installer with an
            # Apple certificate and fail the build.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # NSIS installs self-update signed or not: electron-updater only
            # verifies the downloaded installer's signature when the running
            # app has a publisherName to compare against, which an unsigned
            # build does not. SmartScreen's "unknown publisher" interstitial
            # is the only cost of shipping unsigned here.
            SIGNED=true
          fi
          # An EMPTY CSC_LINK is worse than an absent one: electron-builder reads
          # it as a certificate PATH, resolves it to the project dir, and dies
          # with "<projectDir> not a file". Missing secrets arrive as empty
          # strings, so unset them rather than pass them through.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          # `hardenedRuntime` is false in electron-builder.yml because it cannot
          # be satisfied by the ad-hoc signature scripts/adhoc-sign-mac.mjs
          # applies. With a real Developer ID it is required for notarization,
          # so turn it back on for exactly that case.
          HARDENED=()
          if [ "${RUNNER_OS}" = "macOS" ] && [ "${SIGNED}" = "true" ]; then
            HARDENED=(--config.mac.hardenedRuntime=true)
          fi
          # `"${HARDENED[@]}"` alone dies with "HARDENED[@]: unbound
          # variable" under `set -u` on an empty array — that is macOS's own
          # /bin/bash (3.2.57, last-GPLv2, never upgraded by Apple); bash 4.4+
          # treats an empty array as zero words instead of unset. This is the
          # unsigned path (no MAC_CERT_P12), which is every macOS build this
          # repo has run so far, so it failed 100% of the time and every
          # continuous release shipped Linux-only — no .dmg, no .zip, no
          # latest-mac.yml (v0.1.93 and presumably others). The
          # `${arr[@]+"${arr[@]}"}` idiom expands to nothing when the array is
          # empty and to the real words otherwise, and is nounset-safe on both
          # bash 3.2 and 4.4+.
          npx electron-builder ${{ matrix.args }} --publish always \
            "${HARDENED[@]+"${HARDENED[@]}"}" \
            --config.extraMetadata.version="${{ needs.guard.outputs.version }}" \
            --config.extraMetadata.phosphorSigned="${SIGNED}" \
            --config.publish.provider=github \
            --config.publish.releaseType=release

      # A malformed signature must fail the build that produced it. v0.1.90
      # shipped a bundle whose signature claimed sealed resources it did not
      # have, and nothing in CI noticed — the first report was a user seeing
      # "damaged and can't be opened". `--verify` catches exactly that; it
      # passes for both an ad-hoc and a Developer ID signature, so this guard
      # holds whether or not the certificate secrets are configured.
      - name: Verify the macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          FOUND=0
          for APP in release/mac*/Phosphor.app; do
            [ -d "$APP" ] || continue
            FOUND=1
            echo "== $APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Identifier=|flags=|Sealed' || true
            codesign --verify --deep --strict "$APP"
            echo "   signature verified"
          done
          [ "$FOUND" -eq 1 ] || { echo "::error::no packaged .app found to verify"; exit 1; }

      # The installer must exist under the exact name install docs, checksums
      # and the finalize job's asset check use, and latest.yml — the manifest
      # electron-updater polls on Windows — must name the same file. A publish
      # that uploaded one without the other would leave every Windows install
      # unable to self-update, silently.
      - name: Verify the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          EXE="release/Phosphor-${VERSION}-x64.exe"
          [ -f "$EXE" ] || { echo "::error::${EXE} was not produced"; ls release; exit 1; }
          [ -f "release/latest.yml" ] || { echo "::error::release/latest.yml was not produced"; exit 1; }
          grep -q "^version: ${VERSION}$" release/latest.yml || { echo "::error::latest.yml does not carry ${VERSION}"; cat release/latest.yml; exit 1; }
          grep -q "Phosphor-${VERSION}-x64.exe" release/latest.yml || { echo "::error::latest.yml does not reference ${EXE}"; cat release/latest.yml; exit 1; }
          echo "   $(du -h "$EXE" | cut -f1) installer, manifest names it"

  finalize:
    name: Attach installer script and notes
    needs: [guard, build]
    # `!cancelled()` rather than plain success: `build` sets fail-fast: false so
    # that one platform failing still leaves the other's artifacts installable,
    # but that only holds if THIS job still runs to attach install.sh and flip
    # the release out of draft. Gating on build success meant a single red
    # platform stranded every release (v0.1.39-v0.1.43 shipped one bare
    # AppImage each, with no manifest, so nothing could self-update).
    if: ${{ !cancelled() && needs.guard.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # install.sh verifies its download against this file. Without it every
      # install prints "checksums.txt not published — continuing without
      # verification", which is a poor first impression for a curl | sh flow.
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          mkdir -p checksums
          cd checksums
          # Patterns that match nothing are not an error here: which targets
          # exist depends on which platforms built.
          gh release download "$TAG" \
            --pattern '*.AppImage' --pattern '*.deb' \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' || true
          if [ -n "$(ls -A .)" ]; then
            sha256sum * > checksums.txt
            gh release upload "$TAG" checksums.txt --clobber
          else
            echo "::warning::no installable assets found for ${TAG} — skipping checksums."
          fi

      # install.sh builds asset names by hand, and electron-builder expands
      # `${arch}` per TARGET (-x64.dmg but -x86_64.AppImage), so the two drift
      # silently: v0.1.39-v0.1.48 all shipped an AppImage the installer could
      # not name, and `curl | sh` 404'd for every Linux user. Ask the script
      # itself what it would fetch and assert the release has it.
      - name: Verify install.sh can resolve its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          VERSION="${{ needs.guard.outputs.version }}"
          AVAILABLE=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$AVAILABLE"
          # Mirrors the mapping in scripts/install.sh — keep both in step.
          MISSING=0
          for EXPECTED in \
            "Phosphor-${VERSION}-x86_64.AppImage" \
            "Phosphor-${VERSION}-arm64.AppImage" \
            "Phosphor-${VERSION}-x64.dmg" \
            "Phosphor-${VERSION}-arm64.dmg" \
            "Phosphor-${VERSION}-x64.exe"; do
            case "$EXPECTED" in
              *.dmg) grep -q "\.dmg$" <<<"$AVAILABLE" || continue ;;   # mac did not build
              *.AppImage) grep -q "\.AppImage$" <<<"$AVAILABLE" || continue ;;
              *.exe) grep -q "\.exe$" <<<"$AVAILABLE" || continue ;;   # windows did not build
            esac
            if ! grep -qx "$EXPECTED" <<<"$AVAILABLE"; then
              echo "::error::install.sh would request ${EXPECTED}, which this release does not contain."
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "install.sh asset names match the release."

      # install.sh downloads assets by exact name, so it ships with the release
      # it installs. Uploaded after the builds so it cannot race them.
      - name: Upload install.sh and icon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.guard.outputs.tag }}" \
            scripts/install.sh build/icon.png --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          VERSION="${{ needs.guard.outputs.version }}"
          NOTES=$(printf '%s\n' \
            "Automatic release from \`main\` @ \`${SHA:0:7}\`." \
            "" \
            "## Install" \
            "" \
            "macOS / Linux:" \
            "" \
            '```sh' \
            "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh" \
            '```' \
            "" \
            "This replaces an existing install in place." \
            "" \
            "Windows: run \`Phosphor-${VERSION}-x64.exe\` below. The installer is not code-signed, so SmartScreen shows \"unknown publisher\" — choose **More info → Run anyway**. It installs per user and updates itself from then on." \
            "" \
            "Already running Phosphor? It will offer to update itself." \
            "" \
            "Phosphor requires the pi coding agent on your PATH:" \
            "" \
            '```sh' \
            "npm install -g @earendil-works/pi-coding-agent" \
            '```')
          # electron-builder creates the release as a draft; publishing it here
          # (after every asset is attached) is what makes `releases/latest`
          # resolve to it — which is exactly what the updater and install.sh use.
          gh release edit "${{ needs.guard.outputs.tag }}" \
            --draft=false --latest --notes "${NOTES}"
