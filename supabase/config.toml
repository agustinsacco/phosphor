# Isolated local test stack. Never link this configuration to another product's project.
project_id = "phosphor-control-test"

[api]
enabled = true
port = 54351
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54352
shadow_port = 54350
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[realtime]
enabled = true

[storage]
enabled = false

[local_smtp]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
# GitHub sign-in creates the account; email sign-up stays off.
enable_signup = true

[auth.email]
enable_signup = false

# GitHub here is supabase/tests/fixtures/fake-github.cjs, which
# tools/scripts/auth-stack.mjs starts on this stack's network. Never a real
# client: the id and secret are the fixture's own.
[auth.external.github]
enabled = true
client_id = "phosphor-fake-github"
secret = "phosphor-fake-github-secret"
redirect_uri = "http://127.0.0.1:54351/auth/v1/callback"
url = "http://fake-github:54353"
