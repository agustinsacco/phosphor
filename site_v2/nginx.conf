# phosphor.saccolabs.com — static files only.
#
# Port 5015 (element 15) is deliberately NOT 5252: the cluster exposes each
# site as a `type: LoadBalancer` Service, and k3s's servicelb binds that port
# on the node itself, so two sites on one port would leave the second Pending.
server {
    listen 5015;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy: never leak the internal port into redirects.
    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Astro hashes everything under /_astro, so those files can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/index.html =404;
    }
}
